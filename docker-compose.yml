services:
  # =====================================
  # Ensure the Member database exists in the
  # PostgreSQL container that is already running.
  # This does not recreate or delete PostgreSQL.
  # =====================================
  postgres-init:
    image: postgres:17
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-reza}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h host.docker.internal -p 15432 -U postgres; do
          sleep 2
        done

        psql -h host.docker.internal -p 15432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
          -tc "SELECT 1 FROM pg_database WHERE datname='tblmemberabp'" \
          | grep -q 1 \
          || psql -h host.docker.internal -p 15432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
             -c "CREATE DATABASE tblmemberabp"

        echo "Database tblmemberabp is ready."

  # =====================================
  # Book Database Migrator
  # =====================================
  book-migrator:
    build:
      context: .
      dockerfile: src/AbpApiBook.DbMigrator/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=host.docker.internal;Port=15432;Database=tblbookabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # =====================================
  # Member Database Migrator
  # =====================================
  member-migrator:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.DbMigrator/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=host.docker.internal;Port=15432;Database=tblmemberabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

  # =====================================
  # Book Service
  # Connects to the already-running Kafka,
  # Elasticsearch, MinIO and PostgreSQL containers
  # through their published Windows host ports.
  # =====================================
  book:
    build:
      context: .
      dockerfile: src/AbpApiBook.HttpApi.Host/Dockerfile
    container_name: library-book
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=host.docker.internal;Port=15432;Database=tblbookabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
      Kafka__BootstrapServers: "host.docker.internal:9092"
      Elasticsearch__Url: "http://host.docker.internal:9200"
      MinIO__Endpoint: "host.docker.internal:9000"
      MinIO__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      MinIO__SecretKey: "${MINIO_ROOT_PASSWORD:-YourStrongPassword123}"
      MinIO__BucketName: "library-books"
      MinIO__UseSSL: "false"
    ports:
      - "8081:8080"
    depends_on:
      book-migrator:
        condition: service_completed_successfully

  # =====================================
  # Member Service
  # =====================================
  member:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.HttpApi.Host/Dockerfile
    container_name: library-member
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=host.docker.internal;Port=15432;Database=tblmemberabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
      Kafka__BootstrapServers: "host.docker.internal:9092"
    ports:
      - "8082:8080"
    depends_on:
      member-migrator:
        condition: service_completed_successfully

  # =====================================
  # API Gateway
  # =====================================
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: library-gateway
    restart: unless-stopped
    ports:
      - "7155:8080"
    depends_on:
      - book
      - member
