services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      
    ports:
      - "15433:1433"
      
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - '(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1")'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: abpapibook-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  book-migrator:
    build:
      context: .
      dockerfile: src/AbpApiBook.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BookStoreAbp;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  member-migrator:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=LibraryMemberServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  book:
    build:
      context: .
      dockerfile: src/AbpApiBook.HttpApi.Host/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BookStoreAbp;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      RabbitMQ__Connections__Default__HostName: "rabbitmq"
      RabbitMQ__Connections__Default__Port: "5672"
      RabbitMQ__Connections__Default__UserName: "guest"
      RabbitMQ__Connections__Default__Password: "guest"
    expose:
      - "8080"
    depends_on:
      book-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  member:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.HttpApi.Host/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=LibraryMemberServiceDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      RabbitMQ__Connections__Default__HostName: "rabbitmq"
      RabbitMQ__Connections__Default__Port: "5672"
      RabbitMQ__Connections__Default__UserName: "guest"
      RabbitMQ__Connections__Default__Password: "guest"
    expose:
      - "8080"
    depends_on:
      member-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    ports:
      - "7155:8080"
    depends_on:
      - book
      - member
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  sqlserver_data: