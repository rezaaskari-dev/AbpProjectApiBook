
services:

  # =====================================
  # PostgreSQL
  # =====================================
  postgres:
    image: postgres:17
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reza}
      POSTGRES_DB: tblbookabp
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tblbookabp"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =====================================
  # Create second PostgreSQL database
  # =====================================
  postgres-init:
    image: postgres:17
    container_name: library-postgres-init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-reza}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until pg_isready -h postgres -p 5432 -U postgres; do
          sleep 2
        done

        psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 \
          -tc "SELECT 1 FROM pg_database WHERE datname='tblmemberabp'" \
          | grep -q 1 \
          || psql -h postgres -U postgres -d postgres -v ON_ERROR_STOP=1 \
             -c "CREATE DATABASE tblmemberabp"

        echo "Both databases are ready."
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # =====================================
  # Apache Kafka - KRaft
  # =====================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: library-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # =====================================
  # Elasticsearch
  # =====================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    container_name: library-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200 >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # =====================================
  # Kibana
  
 # kibana:
    #image: docker.elastic.co/kibana/kibana:8.17.5
    #container_name: library-kibana
    #restart: unless-stopped
   # ports:
     # - "5601:5601"
   # environment:
     # ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
   # depends_on:
     # elasticsearch:
       # condition: service_healthy
   # networks:
    #  - backend
      # =====================================

  # =====================================
  # MinIO
  # =====================================
  
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: library-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-YourStrongPassword123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # =====================================
  # Book Database Migrator
  # =====================================
  book-migrator:
    build:
      context: .
      dockerfile: src/AbpApiBook.DbMigrator/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tblbookabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend

  # =====================================
  # Member Database Migrator
  # =====================================
  member-migrator:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.DbMigrator/Dockerfile
    restart: "no"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tblmemberabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - backend

  # =====================================
  # Book Service
  # =====================================
  book:
    build:
      context: .
      dockerfile: src/AbpApiBook.HttpApi.Host/Dockerfile
    container_name: library-book
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tblbookabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"

      Kafka__BootstrapServers: "kafka:9092"

      Elasticsearch__Url: "http://elasticsearch:9200"

      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "${MINIO_ROOT_USER:-minioadmin}"
      MinIO__SecretKey: "${MINIO_ROOT_PASSWORD:-YourStrongPassword123}"
      MinIO__BucketName: "library-books"
      MinIO__UseSSL: "false"

    expose:
      - "8080"
    depends_on:
      book-migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend

  # =====================================
  # Member Service
  # =====================================
  member:
    build:
      context: ./LibraryMemberService
      dockerfile: src/LibraryMemberService.HttpApi.Host/Dockerfile
    container_name: library-member
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=tblmemberabp;Username=postgres;Password=${POSTGRES_PASSWORD:-reza}"

      Kafka__BootstrapServers: "kafka:9092"

    expose:
      - "8080"
    depends_on:
      member-migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    networks:
      - backend

  # =====================================
  # API Gateway
  # =====================================
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: library-gateway
    restart: unless-stopped
    ports:
      - "7155:8080"
    depends_on:
      - book
      - member
    networks:
      - backend

# =====================================
# Networks
# =====================================
networks:
  backend:
    driver: bridge

# =====================================
# Volumes
# =====================================
volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data:
  minio_data:
